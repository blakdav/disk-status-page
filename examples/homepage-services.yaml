# Merge this group into Homepage's services.yaml.
# GET reads cached observations only; do not configure POST /api/action here.
# Replace href with your NPM HTTPS address if desired.
- Storage:
    - Disk Status:
        href: http://172.23.24.16:8088
        description: NAS disk state and health
        widget:
          type: customapi
          url: http://172.23.24.16:8088/api/homepage
          refreshInterval: 30000
          mappings:
            - field: summary.awake
              label: "🟢 Awake"
              format: number
            - field: summary.sleeping
              label: "🔵 Sleeping"
              format: number
            - field: summary.attention
              label: "🔴 Attention"
              format: number
            - field: summary.known_issues
              label: "🟡 Known issues"
              format: number
    # Optional detailed panel; requires a Homepage version supporting
    # Custom API dynamic-list. This lists every configured disk separately.
    - Disk Details:
        href: http://172.23.24.16:8088
        widget:
          type: customapi
          url: http://172.23.24.16:8088/api/homepage
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: disks
            name: label
            label: description
            limit: 8
