# Merge this group into Homepage's services.yaml.
# GET reads cached observations only; do not configure POST /api/action here.
# Replace href with your NPM HTTPS address if desired.
- Storage:
    - Disk Status:
        href: http://172.23.24.16:8088
        description: NAS disk state and health
        # Independent HTTP check; red if the collector data stops advancing.
        siteMonitor: http://172.23.24.16:8088/healthz
        statusStyle: dot
        widget:
          type: customapi
          url: http://172.23.24.16:8088/api/homepage
          refreshInterval: 30000
          # Block view shows only four fields; list keeps freshness visible.
          display: list
          mappings:
            - field: freshness.label
              label: Data
              format: text
            - field: summary.awake
              label: "Awake"
              format: number
            - field: summary.sleeping
              label: "Sleeping"
              format: number
            - field: summary.attention
              label: "Attention"
              format: number
            # Disks awake that should sleep (or the reverse), from their role.
            - field: summary.unexpected_state
              label: "Unexpected"
              format: number
    # Optional detailed panel; requires a Homepage version supporting
    # Custom API dynamic-list. Each row shows the disk's role and power
    # state, flags a state its role does not expect, and lists only
    # unacknowledged issues, e.g. "Cold spare · Awake (expected asleep)".
    - Disk Details:
        href: http://172.23.24.16:8088
        siteMonitor: http://172.23.24.16:8088/healthz
        statusStyle: dot
        widget:
          type: customapi
          url: http://172.23.24.16:8088/api/homepage
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: disks
            name: label
            label: description
            limit: 8
    - SnapRAID Sync:
        href: http://172.23.24.16:8088
        siteMonitor: http://172.23.24.16:8088/healthz
        statusStyle: dot
        widget:
          type: customapi
          url: http://172.23.24.16:8088/api/homepage
          refreshInterval: 30000
          display: list
          mappings:
            - field: snapraid.state_label
              label: Sync
              format: text
            - field: snapraid.finished_label
              label: Last finished
              format: text
            - field: snapraid.result_label
              label: Last result
              format: text
            - field: schedules.sync.label
              label: Sync schedule
              format: text
            - field: schedules.scrub.label
              label: Scrub schedule
              format: text
    - Pool Capacity:
        href: http://172.23.24.16:8088
        siteMonitor: http://172.23.24.16:8088/healthz
        statusStyle: dot
        widget:
          type: customapi
          url: http://172.23.24.16:8088/api/homepage
          refreshInterval: 30000
          mappings:
            - field: pool.total_label
              label: Total
              format: text
            - field: pool.used_label
              label: Used
              format: text
            - field: pool.free_label
              label: Free
              format: text
            - field: pool.available_label
              label: Available
              format: text
