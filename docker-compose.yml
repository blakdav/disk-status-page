services:
  disk-status-page:
    image: ghcr.io/blakdav/disk-status-page:latest
    container_name: disk-status-page
    restart: unless-stopped
    # Initial hardware-compatible configuration; reduce after NAS testing.
    # This grants broad host access. Explicit disk actions require clicking Unlock controls on the dashboard.
    privileged: true
    ports:
      - "8088:8080"
    environment:
      TZ: America/Los_Angeles
      POLL_SECONDS: "30"
      SMART_SECONDS: "1800"
    volumes:
      # NVMe storage: recording history must not wake the monitored disks.
      - /mnt/vault/apps/disk-status-page:/data
      # Includes serial-based udev links and supports disks across reboots.
      - /dev:/dev:ro
      # Spin-down checks must use the NAS mount namespace, not the container's.
      - type: bind
        source: /proc/1/mountinfo
        target: /host/mountinfo
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /proc/swaps
        target: /host/swaps
        read_only: true
        bind:
          create_host_path: false
      # Atomic lifecycle records from the Ansible-managed systemd sync hooks.
      - type: bind
        source: /opt/docker/disk-status-page/status/snapraid
        target: /host/snapraid
        read_only: true
        bind:
          create_host_path: false
      # Detect a run interrupted by NAS reboot instead of showing Running forever.
      - type: bind
        source: /proc/sys/kernel/random/boot_id
        target: /host/boot_id
        read_only: true
        bind:
          create_host_path: false
      # Read filesystem totals without exposing writable data paths.
      - type: bind
        source: /mnt/disks
        target: /host/disks
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false
      - type: bind
        source: /mnt/pool
        target: /host/pool
        read_only: true
        bind:
          create_host_path: false
      # Display the installed timer definitions rather than a hardcoded schedule.
      - type: bind
        source: /etc/systemd/system
        target: /host/systemd
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
