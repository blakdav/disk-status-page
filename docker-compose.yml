services:
  disk-status-page:
    image: ghcr.io/blakdav/disk-status-page:latest
    container_name: disk-status-page
    restart: unless-stopped
    # Not privileged. The app only needs to send ATA commands (power state,
    # standby, SMART) to the SATA disks, and read the NVMe drives' health log:
    # - SYS_RAWIO and SYS_ADMIN: the kernel requires both for the ATA ioctls
    #   hdparm and smartctl use, and SYS_ADMIN for NVMe admin commands.
    #   Every other capability is dropped.
    # - device_cgroup_rules: read-only opens of sd* disks (block major 8,
    #   sda-sdp) and NVMe namespaces (block major 259). No other host
    #   devices can be opened.
    # Docker's seccomp and AppArmor profiles stay in force.
    cap_drop: [ALL]
    cap_add: [SYS_RAWIO, SYS_ADMIN]
    device_cgroup_rules:
      - "b 8:* r"
      - "b 259:* r"
    security_opt:
      - no-new-privileges:true
    # Only /data (and /tmp for SQLite scratch files) is writable.
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8088:8080"
    environment:
      TZ: America/Los_Angeles
      POLL_SECONDS: "30"
      SMART_SECONDS: "1800"
      DEV_DIR: /host/dev
      # Names the dashboard is opened by, comma-separated. Disk controls
      # refuse requests addressed to any other name (DNS rebinding). Add the
      # Nginx Proxy Manager hostname here if you put one in front.
      ALLOWED_HOSTS: "172.23.24.16,debian-nas"
    volumes:
      # NVMe storage: recording history must not wake the monitored disks.
      # The vault mount is nofail, so Docker can start before it is mounted.
      # create_host_path: false only refuses a missing folder; a folder that
      # exists under the unmounted vault would still be used. So the app also
      # requires the .vault-marker file that Ansible puts in this folder after
      # checking the vault is mounted. Without it the app exits, and Docker
      # retries (up to a minute apart) until the vault is mounted.
      - type: bind
        source: /mnt/vault/apps/disk-status-page
        target: /data
        bind:
          create_host_path: false
      # The disk list (config/disks.json beside this file): each disk's
      # label, serial, role and expected power state. The NAS's Ansible
      # writes it from its pool lists and restarts the container when it
      # changes. A folder, not the file, so a replaced file is seen.
      - type: bind
        source: ./config
        target: /config
        read_only: true
        bind:
          create_host_path: false
      # The host's /dev, for the serial-based udev links (by-id), which
      # follow disks across reboots. Mounted beside the container's own /dev,
      # and not recursively, so the host's /dev/shm, /dev/pts and /dev/mqueue
      # stay out. Read-only does not stop writes to device nodes; the device
      # rule above is what limits access.
      - type: bind
        source: /dev
        target: /host/dev
        read_only: true
        bind:
          recursive: disabled
          create_host_path: false
      # Spin-down checks must use the NAS mount namespace, not the container's.
      - type: bind
        source: /proc/1/mountinfo
        target: /host/mountinfo
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /proc/swaps
        target: /host/swaps
        read_only: true
        bind:
          create_host_path: false
      # Atomic lifecycle records from the Ansible-managed systemd sync hooks.
      - type: bind
        source: /opt/docker/disk-status-page/status/snapraid
        target: /host/snapraid
        read_only: true
        bind:
          create_host_path: false
      # Detect a run interrupted by NAS reboot instead of showing Running forever.
      - type: bind
        source: /proc/sys/kernel/random/boot_id
        target: /host/boot_id
        read_only: true
        bind:
          create_host_path: false
      # Read filesystem totals without exposing writable data paths.
      - type: bind
        source: /mnt/disks
        target: /host/disks
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false
      # rslave: mergerfs is nofail too and may mount after the container
      # starts, or be remounted; without it the container keeps seeing the
      # empty folder underneath. Relies on the host's / being a shared mount,
      # which systemd sets up by default.
      - type: bind
        source: /mnt/pool
        target: /host/pool
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false
      # The NVMe drives' filesystems, for their capacity only (statfs). Each
      # disk list entry with a capacity_path names one of these. rslave, as
      # above: both mounts are nofail and may appear after the container.
      - type: bind
        source: /mnt/vault
        target: /host/mounts/vault
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false
      - type: bind
        source: /mnt/scratch
        target: /host/mounts/scratch
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false
      # Display the installed timer definitions rather than a hardcoded schedule.
      - type: bind
        source: /etc/systemd/system
        target: /host/systemd
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
